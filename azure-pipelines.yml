trigger:
  - main

pool:
  vmImage: "ubuntu-latest"
 
variables:
  node_version: "22.x"
  webAppName: "app-arion-api-prod"
  azureSubscription: "IADM-Prod-ARM"

steps:
  - checkout: self
    clean: true

  - script: |
      echo "Repo contents:"
      ls -la
      if [ ! -f package.json ]; then
        echo "No package.json yet (ARION API code not scaffolded). Pipeline intentionally exits success."
        exit 0
      fi
    displayName: "Guard: skip until code scaffold exists"

  - task: NodeTool@0
    displayName: "Use Node $(node_version)"
    inputs:
      versionSpec: "$(node_version)"

  - script: |
      npm ci
      if npm run | grep -q "contract-check"; then npm run contract-check; fi
    displayName: "npm ci (+ optional contract-check)"

  - task: ArchiveFiles@2
    displayName: "Archive app into drop.zip"
    inputs:
      rootFolderOrFile: "$(System.DefaultWorkingDirectory)"
      includeRootFolder: false
      archiveType: "zip"
      archiveFile: "$(Build.ArtifactStagingDirectory)/drop.zip"
      replaceExistingArchive: true

  - task: AzureWebApp@1
    displayName: "Deploy drop.zip to $(webAppName)"
    inputs:
      azureSubscription: "$(azureSubscription)"
      appName: "$(webAppName)"
      package: "$(Build.ArtifactStagingDirectory)/drop.zip"