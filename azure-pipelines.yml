# ──────────────────────────────────────────────────────────────────────────────
# arion-api CI/CD
#
# Post-deploy migration runner (added 2026-06-20):
#   After the AzureWebApp@1 deploy step, an AzureCLI@2 task runs
#   `scripts/run-pipeline-migrations.js` against iadm_services. The runner:
#     1) Lists db/migrations/*.sql in numeric order
#     2) Reads db.schema_migrations to find what's already applied (scoped by
#        repo='arion-api')
#     3) Logs a dry-run summary first
#     4) Applies pending migrations in apply mode, recording each one
#     5) Fails the build on any migration error (exit 2)
#
#   Bootstrap (ONE-TIME, manual): apply db/migrations/000_schema_migrations.sql
#   from a dev machine with `az login` + db_ddladmin:
#     node scripts/run-migration.js db/migrations/000_schema_migrations.sql
#
#   After bootstrap, every future migration committed to db/migrations/ is
#   picked up automatically on the next deploy. Never apply migrations by
#   hand again.
# ──────────────────────────────────────────────────────────────────────────────

trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  node_version: "22.x"
  webAppName: "app-arion-api-prod"
  resourceGroup: "rg-apps-prod"
  azureSubscription: "IADM-Prod-ARM"

steps:
  - task: NodeTool@0
    displayName: "Use Node $(node_version)"
    inputs:
      versionSpec: "$(node_version)"

  - checkout: self
    clean: true

  - script: |
      set -e
      echo "Working directory:"
      pwd
      ls -la

      echo "Installing dependencies..."
      npm install

      if npm run | grep -q " contract-check"; then
        echo "Running contract-check..."
        npm run contract-check
      fi

      if npm run | grep -q " build"; then
        echo "Running build..."
        npm run build
      fi

      echo "Pruning dev dependencies..."
      npm prune --omit=dev
    displayName: "npm install (+ optional contract-check/build) + prune"

  - script: |
      set -e
      cd "$(System.DefaultWorkingDirectory)"
      echo "Creating deployment zip..."
      zip -r "$(Build.ArtifactStagingDirectory)/drop.zip" . \
        -x ".git/*" \
           ".gitignore" \
           "azure-pipelines.yml" \
           "*.log" \
           "**/*.log"
      ls -lh "$(Build.ArtifactStagingDirectory)/drop.zip"
    displayName: "Create drop.zip (includes node_modules)"

  - task: AzureWebApp@1
    displayName: "Deploy drop.zip to $(webAppName)"
    inputs:
      azureSubscription: "$(azureSubscription)"
      appName: "$(webAppName)"
      package: "$(Build.ArtifactStagingDirectory)/drop.zip"

  - task: AzureCLI@2
    displayName: "Post-deploy: run pending DB migrations (dry-run + apply)"
    inputs:
      azureSubscription: "$(azureSubscription)"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        set -e
        cd "$(System.DefaultWorkingDirectory)"
        export MIGRATION_REPO=arion-api
        export SQL_SERVER=sql-iadm-prod-cus.database.windows.net
        export SQL_DATABASE=iadm_services
        echo "─── dry-run ───"
        node scripts/run-pipeline-migrations.js --dry-run
        echo "─── apply ───"
        node scripts/run-pipeline-migrations.js --apply
